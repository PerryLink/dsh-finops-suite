<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
<title id="title">dsh-finops-suite structure: a three-step staircase to one 4/4 verdict</title>
<desc id="desc">A staircase, not a row of arrowed boxes. Three ascending treads are the three gates the suite must pass, and the tall panel on the right is the landing platform where the verdict is printed. The cluster at the top left is the only input: package.json (four exact pins), cordis.patch.yml (four insert rows) and the synthetic samples/quickstart/input/profile.json (four enabled rows). Step 1 checks that both manifests and the bundle patch are readable; its failure code is E_SUITE_MANIFEST_MISSING. Step 2 checks that the patch rows and the dependency pins name the same four members, with id equal to name and no duplicates; its failure code is E_SUITE_PATCH_MISMATCH. Step 3 checks that every member resolves at its pin, whether the version comes from node_modules or from the manifest pin, and that the profile row carries the same version; its failure code is E_SUITE_VERSION_MISMATCH. The risers between treads are the only arrows: a gate is climbed, not skipped. The landing prints 4/4 resolved for dsh-einvoice, dsh-bankrec, dsh-ap-three-way, dsh-travel-recon at 0.2.0-alpha.11, 0.1.0-alpha.16, 0.1.0-alpha.11, 0.1.0-alpha.13, with network false, zero writes, zero tools and zero config keys. Every name, version and count is read from the checked-in manifests.</desc>
